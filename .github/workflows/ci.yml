name: CI Pipeline

on:
  pull_request:
    branches:
      - "**"       # run on all PRs
  push:
    branches:
      - main       # also run on main merges

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: codebase/rdicidr-0.1.0

    steps:
      # Step 1: Checkout repo
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Setup Node.js (v15 + npm7 as required by package.json engines)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "15.x"
          cache: "npm"
          cache-dependency-path: codebase/rdicidr-0.1.0/package-lock.json

      # Step 3: Install dependencies
      - name: Install dependencies
        run: npm install

      # Step 4: Run ESLint
      - name: Run ESLint
        run: npm run lint

      # Step 5: Run Prettier (checks formatting)
      - name: Run Prettier
        run: npm run prettier

      # Step 6: Run Tests (React + Jest)
      - name: Run Tests
        run: CI=true npm test -- --watchAll=false

      # Step 7: Build application
      - name: Build application
        run: npm run build
